# ─────────────────────────────────────────────────────────────────────────────
# Admin Panel CI/CD — adminpanel → S3 → CloudFront
# ─────────────────────────────────────────────────────────────────────────────
name: Admin Panel Deploy

on:
  push:
    branches: [main]
    paths:
      - 'adminpanel/**'
      - '.github/workflows/adminpanel-deploy.yml'
  workflow_dispatch:

env:
  AWS_REGION: ap-south-1
  S3_BUCKET: cripto-prod-admin
  CF_DISTRIBUTION_ID: ${{ secrets.ADMIN_CF_DISTRIBUTION_ID }}

jobs:
  deploy:
    name: Build → S3 → CloudFront Invalidate
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: adminpanel/package-lock.json

      - name: Install dependencies
        working-directory: adminpanel
        run: npm ci

      - name: Build
        working-directory: adminpanel
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Sync build to S3
        working-directory: adminpanel
        run: |
          aws s3 sync dist/assets s3://${{ env.S3_BUCKET }}/assets \
            --cache-control "public,max-age=31536000,immutable" \
            --delete

          aws s3 sync dist s3://${{ env.S3_BUCKET }} \
            --exclude "assets/*" \
            --cache-control "no-cache,no-store,must-revalidate" \
            --delete

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ env.CF_DISTRIBUTION_ID }} \
            --paths "/*"

      - name: Deployment summary
        run: |
          echo "## ✅ Admin Panel Deployed" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Deployed by:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
