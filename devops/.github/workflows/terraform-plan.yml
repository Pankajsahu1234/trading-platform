# ─────────────────────────────────────────────────────────────────────────────
# Terraform Plan — runs on every PR to main
# Shows infra changes as a PR comment before merge
# ─────────────────────────────────────────────────────────────────────────────
name: Terraform Plan

on:
  pull_request:
    branches: [main]
    paths:
      - 'infra/terraform/**'

jobs:
  plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    environment: production

    defaults:
      run:
        working-directory: infra/terraform/envs/prod

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.9.0'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ap-south-1

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        id: plan
        env:
          TF_VAR_db_password:  ${{ secrets.TF_DB_PASSWORD }}
          TF_VAR_jwt_secret:   ${{ secrets.TF_JWT_SECRET }}
          TF_VAR_email_user:   ${{ secrets.TF_EMAIL_USER }}
          TF_VAR_email_pass:   ${{ secrets.TF_EMAIL_PASS }}
          TF_VAR_email_from:   ${{ secrets.TF_EMAIL_FROM }}
        run: terraform plan -no-color -out=tfplan 2>&1 | tee plan.txt

      - name: Post plan as PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('infra/terraform/envs/prod/plan.txt', 'utf8');
            const truncated = plan.length > 60000 ? plan.slice(0, 60000) + '\n...(truncated)' : plan;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## Terraform Plan\n\`\`\`hcl\n${truncated}\n\`\`\``
            });
