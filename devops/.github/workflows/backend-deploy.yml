# ─────────────────────────────────────────────────────────────────────────────
# Backend CI/CD — cripto_exchange → ECR → ECS Fargate
# Triggers on push to main branch
# ─────────────────────────────────────────────────────────────────────────────
name: Backend Deploy

on:
  push:
    branches: [main]
    paths:
      - 'cripto_exchange/**'
      - '.github/workflows/backend-deploy.yml'
  workflow_dispatch:  # Manual trigger

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: cripto-prod-backend
  ECS_CLUSTER: cripto-prod-cluster
  ECS_SERVICE: cripto-prod-backend
  CONTAINER_NAME: backend

jobs:
  # ─── Test & Lint ────────────────────────────────────────────────────────────
  test:
    name: Lint & Validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cripto_exchange

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: cripto_exchange/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint --if-present

  # ─── Build & Deploy ─────────────────────────────────────────────────────────
  deploy:
    name: Build → ECR → ECS Deploy
    runs-on: ubuntu-latest
    needs: test
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push Docker image
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        working-directory: cripto_exchange
        run: |
          IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

          docker build \
            -f ../infra/docker/Dockerfile.backend \
            -t "$IMAGE_URI" \
            -t "$ECR_REGISTRY/$ECR_REPOSITORY:latest" \
            .

          docker push "$IMAGE_URI"
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:latest"

          echo "image_uri=$IMAGE_URI" >> $GITHUB_OUTPUT

      - name: Download current ECS task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition "$ECS_CLUSTER" \
            --query taskDefinition \
            > task-definition.json

      - name: Update task definition with new image
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name:  ${{ env.CONTAINER_NAME }}
          image:           ${{ steps.build-image.outputs.image_uri }}

      - name: Deploy to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          task-definition:         ${{ steps.task-def.outputs.task-definition }}
          service:                 ${{ env.ECS_SERVICE }}
          cluster:                 ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
          codedeploy-appspec:      false

      - name: Deployment summary
        run: |
          echo "## ✅ Backend Deployed" >> $GITHUB_STEP_SUMMARY
          echo "- **Image:** ${{ steps.build-image.outputs.image_uri }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Deployed by:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY

      - name: Notify on failure
        if: failure()
        run: |
          echo "❌ Deployment FAILED for commit ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "ECS has rolled back to the previous version automatically."
