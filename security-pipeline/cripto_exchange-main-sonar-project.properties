# SonarQube configuration for Backend
sonar.projectKey=timo-backend
sonar.projectName=Timo Backend
sonar.projectVersion=1.0

sonar.sources=src
sonar.exclusions=node_modules/**,prisma/migrations/**,**/*.test.js,**/*.spec.js

sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Security hotspots
sonar.security.sources=src

# Language
sonar.language=js
sonar.sourceEncoding=UTF-8
