title = "Timo Gitleaks Config"

[extend]
useDefault = true

[[rules]]
description = "Tron Private Key"
id = "tron-private-key"
regex = '''(?i)(PRIVATE_KEY)\s*[=:]\s*['""]?([a-fA-F0-9]{64})['""]?'''
tags = ["crypto", "tron"]

[[rules]]
description = "Database URL with credentials"
id = "database-url"
regex = '''mysql://[^:]+:[^@]+@'''
tags = ["database"]

[allowlist]
files = [
  '''\.env\.example''',
  '''terraform\.tfvars\.example''',
  '''STEP-BY-STEP\.md''',
  '''README\.md''',
  '''DEVSECOPS-README\.md''',
]
regexes = [
  '''CHANGE_ME''',
  '''your-.*-here''',
  '''placeholder''',
  '''YzRBbIIqpOwBAwWbyWVLDkFFUtmjbERJ''',
]
