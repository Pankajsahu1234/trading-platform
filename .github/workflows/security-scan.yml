# ─────────────────────────────────────────────────────────────────────────────
# DevSecOps — Security Scanning Pipeline
# Runs on every PR + push to main
# Checks: Secrets, npm audit, Terraform security
# ─────────────────────────────────────────────────────────────────────────────
name: Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ─── 1. Secrets Scanning ────────────────────────────────────────────────────
  secrets-scan:
    name: Secrets Scanning (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for better scanning

      - name: Gitleaks — Scan for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─── 2. npm audit — Backend ─────────────────────────────────────────────────
  npm-audit-backend:
    name: npm audit (Backend)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cripto_exchange-main

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: npm audit
        run: npm audit --audit-level=high
        continue-on-error: true  # Report but don't fail pipeline

      - name: npm audit — JSON report
        run: npm audit --json > /tmp/backend-audit.json 2>/dev/null || true

      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: backend-npm-audit
          path: /tmp/backend-audit.json

  # ─── 3. npm audit — Frontend ────────────────────────────────────────────────
  npm-audit-frontend:
    name: npm audit (Frontend)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fintech-main

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: npm audit
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: npm audit — JSON report
        run: npm audit --json > /tmp/frontend-audit.json 2>/dev/null || true

      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: frontend-npm-audit
          path: /tmp/frontend-audit.json

  # ─── 4. npm audit — Admin Panel ─────────────────────────────────────────────
  npm-audit-admin:
    name: npm audit (Admin Panel)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: adminpanel-main

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: npm audit
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: npm audit — JSON report
        run: npm audit --json > /tmp/admin-audit.json 2>/dev/null || true

      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: admin-npm-audit
          path: /tmp/admin-audit.json

  # ─── 5. Terraform Security (tfsec + checkov) ────────────────────────────────
  terraform-security:
    name: Terraform Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: tfsec — Terraform security scanner
        uses: aquasecurity/tfsec-action@v1.0.0
        with:
          working_directory: devops/infra/terraform
          soft_fail: true  # Report but don't fail pipeline

      - name: Checkov — IaC security scan
        uses: bridgecrewio/checkov-action@master
        with:
          directory: devops/infra/terraform
          framework: terraform
          soft_fail: true
          output_format: github_failed_only

  # ─── 6. Docker Image Security ───────────────────────────────────────────────
  docker-security:
    name: Docker Image Security (Trivy)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image for scanning
        run: |
          docker build \
            -f devops/infra/docker/Dockerfile.backend \
            -t timo-backend:scan \
            ./cripto_exchange-main

      - name: Trivy — Scan Docker image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: timo-backend:scan
          format: table
          severity: HIGH,CRITICAL
          exit-code: 0  # Report but don't fail

      - name: Trivy — Generate SARIF report
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: timo-backend:scan
          format: sarif
          output: trivy-results.sarif

      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
        continue-on-error: true

  # ─── Summary ─────────────────────────────────────────────────────────────────
  security-summary:
    name: Security Summary
    runs-on: ubuntu-latest
    needs:
      - secrets-scan
      - npm-audit-backend
      - npm-audit-frontend
      - npm-audit-admin
      - terraform-security
      - docker-security
    if: always()

    steps:
      - name: Summary
        run: |
          echo "## 🔒 Security Scan Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Secrets Scan | ${{ needs.secrets-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| npm audit Backend | ${{ needs.npm-audit-backend.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| npm audit Frontend | ${{ needs.npm-audit-frontend.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| npm audit Admin | ${{ needs.npm-audit-admin.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Terraform Security | ${{ needs.terraform-security.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Docker Security | ${{ needs.docker-security.result }} |" >> $GITHUB_STEP_SUMMARY
