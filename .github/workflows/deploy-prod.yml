name: Deploy to Prod

on:
  workflow_dispatch:
    inputs:
      deploy_backend:
        description: 'Deploy Backend?'
        type: boolean
        default: true
      deploy_frontend:
        description: 'Deploy Frontend?'
        type: boolean
        default: true
      deploy_admin:
        description: 'Deploy Admin Panel?'
        type: boolean
        default: true
      api_url:
        description: 'Backend API URL (e.g. https://api.timofx.com/api)'
        type: string
        default: 'https://api.timofx.com/api'

jobs:
  deploy-backend:
    name: Backend
    runs-on: ubuntu-latest
    if: ${{ inputs.deploy_backend }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.PROD_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.PROD_AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Login to ECR
        run: |
          aws ecr get-login-password --region ap-south-1 | \
          docker login --username AWS --password-stdin \
          ${{ secrets.PROD_AWS_ACCOUNT_ID }}.dkr.ecr.ap-south-1.amazonaws.com

      - name: Build and Push Docker image
        run: |
          docker buildx build --platform linux/amd64 \
            -f devops/docker/Dockerfile.backend \
            -t ${{ secrets.PROD_AWS_ACCOUNT_ID }}.dkr.ecr.ap-south-1.amazonaws.com/timo-prod2-backend:latest \
            cripto_exchange-main --push

      - name: Deploy to ECS
        run: |
          aws ecs update-service \
            --cluster timo-prod2-cluster \
            --service timo-prod2-backend \
            --force-new-deployment \
            --region ap-south-1

      - name: Wait for deployment
        run: |
          aws ecs wait services-stable \
            --cluster timo-prod2-cluster \
            --services timo-prod2-backend \
            --region ap-south-1
          echo "✅ Backend deployed!"

  deploy-frontend:
    name: Frontend
    runs-on: ubuntu-latest
    if: ${{ inputs.deploy_frontend }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.PROD_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.PROD_AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: fintech-main/package-lock.json

      - name: Install & Build
        working-directory: fintech-main
        run: |
          npm ci
          VITE_API_URL="${{ inputs.api_url }}" npm run build

      - name: Deploy to S3
        run: |
          aws s3 sync fintech-main/dist s3://${{ secrets.PROD_FRONTEND_BUCKET }} --delete --quiet

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.PROD_FRONTEND_CF_ID }} \
            --paths '/*'
          echo "✅ Frontend deployed!"

  deploy-admin:
    name: Admin Panel
    runs-on: ubuntu-latest
    if: ${{ inputs.deploy_admin }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.PROD_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.PROD_AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: adminpanel-main/package-lock.json

      - name: Install & Build
        working-directory: adminpanel-main
        run: |
          npm ci
          VITE_API_URL="${{ inputs.api_url }}" npm run build

      - name: Deploy to S3
        run: |
          aws s3 sync adminpanel-main/dist s3://${{ secrets.PROD_ADMIN_BUCKET }} --delete --quiet

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.PROD_ADMIN_CF_ID }} \
            --paths '/*'
          echo "✅ Admin deployed!"
