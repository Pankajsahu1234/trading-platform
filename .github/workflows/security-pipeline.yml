# ─────────────────────────────────────────────────────────────────────────────
# DevSecOps — Complete Security Pipeline
# Tools: OWASP ZAP + SonarQube + OWASP Dependency Check + Trivy
# Reports: HTML — downloadable from GitHub Actions artifacts
# Triggers: Every push to main + Every PR
# ─────────────────────────────────────────────────────────────────────────────
name: Security Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 2 * * 1'  # Every Monday 2AM UTC (weekly full scan)
  workflow_dispatch:

env:
  BACKEND_URL: https://api.timofx.com

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # JOB 1: Trivy — Docker Image + Filesystem Vulnerability Scan
  # ───────────────────────────────────────────────────────────────────────────
  trivy-scan:
    name: Trivy — Container & Dependency Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image for scanning
        run: |
          docker build \
            -f devops/docker/Dockerfile.backend \
            -t timo-backend:${{ github.sha }} \
            ./cripto_exchange-main

      # Scan Docker image
      - name: Trivy — Docker image scan (HTML)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: timo-backend:${{ github.sha }}
          format: template
          template: '@/contrib/html.tpl'
          output: trivy-docker-report.html
          severity: CRITICAL,HIGH,MEDIUM
          exit-code: 0

      # Scan filesystem (node_modules, package.json)
      - name: Trivy — Backend filesystem scan (HTML)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: ./cripto_exchange-main
          format: template
          template: '@/contrib/html.tpl'
          output: trivy-backend-fs-report.html
          severity: CRITICAL,HIGH,MEDIUM
          exit-code: 0

      - name: Trivy — Frontend filesystem scan (HTML)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: ./fintech-main
          format: template
          template: '@/contrib/html.tpl'
          output: trivy-frontend-fs-report.html
          severity: CRITICAL,HIGH,MEDIUM
          exit-code: 0

      # JSON report for summary
      - name: Trivy — JSON report for summary
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: timo-backend:${{ github.sha }}
          format: json
          output: trivy-summary.json
          severity: CRITICAL,HIGH
          exit-code: 0

      - name: Trivy — Generate summary
        run: |
          CRITICAL=$(cat trivy-summary.json | python3 -c "import json,sys; d=json.load(sys.stdin); vulns=[v for r in d.get('Results',[]) for v in r.get('Vulnerabilities',[]) or [] if v['Severity']=='CRITICAL']; print(len(vulns))" 2>/dev/null || echo "0")
          HIGH=$(cat trivy-summary.json | python3 -c "import json,sys; d=json.load(sys.stdin); vulns=[v for r in d.get('Results',[]) for v in r.get('Vulnerabilities',[]) or [] if v['Severity']=='HIGH']; print(len(vulns))" 2>/dev/null || echo "0")
          echo "## 🔍 Trivy Scan Results" >> $GITHUB_STEP_SUMMARY
          echo "| Severity | Count |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| 🔴 CRITICAL | $CRITICAL |" >> $GITHUB_STEP_SUMMARY
          echo "| 🟠 HIGH | $HIGH |" >> $GITHUB_STEP_SUMMARY

      - name: Upload Trivy HTML reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-security-reports
          path: |
            trivy-docker-report.html
            trivy-backend-fs-report.html
            trivy-frontend-fs-report.html
          retention-days: 30

  # ───────────────────────────────────────────────────────────────────────────
  # JOB 2: OWASP Dependency Check — CVE scan for all projects
  # ───────────────────────────────────────────────────────────────────────────
  owasp-dependency-check:
    name: OWASP Dependency Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Backend dependencies
        working-directory: cripto_exchange-main
        run: npm ci

      - name: Install Frontend dependencies
        working-directory: fintech-main
        run: npm ci

      - name: Install Admin dependencies
        working-directory: adminpanel-main
        run: npm ci

      - name: OWASP Dependency Check — Backend
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: 'Timo-Backend'
          path: './cripto_exchange-main'
          format: 'HTML'
          out: 'owasp-backend-report'
          args: >
            --enableRetired
            --enableExperimental
            --failOnCVSS 9
            --suppression .github/owasp-suppressions.xml
        continue-on-error: true

      - name: OWASP Dependency Check — Frontend
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: 'Timo-Frontend'
          path: './fintech-main'
          format: 'HTML'
          out: 'owasp-frontend-report'
          args: >
            --enableRetired
            --failOnCVSS 9
        continue-on-error: true

      - name: Upload OWASP HTML reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: owasp-dependency-check-reports
          path: |
            owasp-backend-report/
            owasp-frontend-report/
          retention-days: 30

  # ───────────────────────────────────────────────────────────────────────────
  # JOB 3: OWASP ZAP — API Security Testing (DAST)
  # ───────────────────────────────────────────────────────────────────────────
  owasp-zap:
    name: OWASP ZAP — API Security Test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Create ZAP API scan config
      - name: Create ZAP scan config
        run: |
          cat > zap-api-scan.yaml << 'EOF'
          env:
            contexts:
              - name: "Timo API"
                urls:
                  - "https://api.timofx.com"
            parameters:
              failOnError: false
              progressToStdout: true
          jobs:
            - type: openapi
              parameters:
                apiUrl: "https://api.timofx.com/health"
            - type: spider
              parameters:
                url: "https://api.timofx.com/api"
                maxDuration: 2
            - type: activeScan
              parameters:
                maxScanDurationInMins: 5
            - type: report
              parameters:
                template: "traditional-html"
                reportDir: "/zap/reports"
                reportFile: "zap-report.html"
          EOF

      # ZAP Baseline scan (passive — no active attacks)
      - name: OWASP ZAP — Baseline API scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: ${{ env.BACKEND_URL }}
          rules_file_name: '.github/zap-rules.tsv'
          cmd_options: '-a'
          allow_issue_writing: false
        continue-on-error: true

      # ZAP Full API scan
      - name: OWASP ZAP — Full API scan
        uses: zaproxy/action-api-scan@v0.7.0
        with:
          target: '${{ env.BACKEND_URL }}/health'
          format: openapi
          allow_issue_writing: false
          cmd_options: '-a -j'
        continue-on-error: true

      - name: Rename ZAP reports
        run: |
          mkdir -p zap-reports
          [ -f report_html.html ] && mv report_html.html zap-reports/zap-baseline-report.html || echo "No baseline report"
          [ -f report_json.json ] && mv report_json.json zap-reports/zap-report.json || echo "No JSON report"

          # Generate summary from JSON
          if [ -f zap-reports/zap-report.json ]; then
            python3 << 'PYEOF'
          import json, os
          with open('zap-reports/zap-report.json') as f:
            data = json.load(f)
          
          high = sum(1 for site in data.get('site', []) for alert in site.get('alerts', []) if alert.get('riskcode') == '3')
          medium = sum(1 for site in data.get('site', []) for alert in site.get('alerts', []) if alert.get('riskcode') == '2')
          low = sum(1 for site in data.get('site', []) for alert in site.get('alerts', []) if alert.get('riskcode') == '1')
          
          summary = f"""## 🔒 OWASP ZAP Results
          | Risk | Count |
          |---|---|
          | 🔴 High | {high} |
          | 🟠 Medium | {medium} |
          | 🟡 Low | {low} |
          """
          with open(os.environ.get('GITHUB_STEP_SUMMARY', '/dev/null'), 'a') as f:
            f.write(summary)
          PYEOF
          fi

      - name: Upload ZAP reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: owasp-zap-reports
          path: zap-reports/
          retention-days: 30

  # ───────────────────────────────────────────────────────────────────────────
  # JOB 4: SonarQube — Code Quality + SAST
  # ───────────────────────────────────────────────────────────────────────────
  sonarqube:
    name: SonarQube — Code Quality & SAST
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for better analysis

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: SonarQube Scan — Backend
        uses: SonarSource/sonarqube-scan-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          projectBaseDir: cripto_exchange-main
          args: >
            -Dsonar.projectKey=timo-backend
            -Dsonar.projectName="Timo Backend"
            -Dsonar.sources=src
            -Dsonar.exclusions=node_modules/**,prisma/**
            -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info
        continue-on-error: true

      - name: SonarQube Scan — Frontend
        uses: SonarSource/sonarqube-scan-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          projectBaseDir: fintech-main
          args: >
            -Dsonar.projectKey=timo-frontend
            -Dsonar.projectName="Timo Frontend"
            -Dsonar.sources=client/src
            -Dsonar.exclusions=node_modules/**
        continue-on-error: true

      # Generate HTML report using sonar-report tool
      - name: Install sonar-report
        run: npm install -g sonar-report
        continue-on-error: true

      - name: Generate SonarQube HTML Report
        run: |
          mkdir -p sonar-reports
          sonar-report \
            --sonarurl="${{ secrets.SONAR_HOST_URL }}" \
            --sonartoken="${{ secrets.SONAR_TOKEN }}" \
            --sonarcomponent="timo-backend" \
            --project="Timo Backend" \
            --output="sonar-reports/sonar-backend-report.html" || echo "SonarQube report generation skipped"
        continue-on-error: true

      - name: Upload SonarQube reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sonarqube-reports
          path: sonar-reports/
          retention-days: 30

  # ───────────────────────────────────────────────────────────────────────────
  # JOB 5: Secrets Scanning — Gitleaks
  # ───────────────────────────────────────────────────────────────────────────
  secrets-scan:
    name: Gitleaks — Secrets Scanning
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Gitleaks — Generate HTML report
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.18.0/gitleaks_8.18.0_linux_x64.tar.gz | tar -xz
          mkdir -p gitleaks-reports
          ./gitleaks detect \
            --source . \
            --report-format html \
            --report-path gitleaks-reports/gitleaks-report.html \
            --no-banner \
            --config .gitleaks.toml || echo "Scan complete"

      - name: Upload Gitleaks report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gitleaks-secrets-report
          path: gitleaks-reports/
          retention-days: 30

  # ───────────────────────────────────────────────────────────────────────────
  # JOB 6: Final Security Report — Consolidate all results
  # ───────────────────────────────────────────────────────────────────────────
  security-report:
    name: Generate Final Security Report
    runs-on: ubuntu-latest
    needs:
      - trivy-scan
      - owasp-dependency-check
      - owasp-zap
      - sonarqube
      - secrets-scan
    if: always()

    steps:
      - name: Download all reports
        uses: actions/download-artifact@v4
        with:
          path: all-reports/

      - name: Generate consolidated HTML report
        run: |
          cat > all-reports/index.html << 'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Timo Security Report</title>
            <style>
              * { margin: 0; padding: 0; box-sizing: border-box; }
              body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0d1117; color: #e6edf3; }
              .header { background: linear-gradient(135deg, #1a1f2e, #161b27); padding: 40px; border-bottom: 1px solid #30363d; }
              .header h1 { font-size: 28px; font-weight: 700; color: #58a6ff; }
              .header p { color: #8b949e; margin-top: 8px; }
              .badge { display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; margin-left: 12px; }
              .badge.success { background: #1a4a2e; color: #3fb950; border: 1px solid #3fb950; }
              .badge.warning { background: #4a3000; color: #d29922; border: 1px solid #d29922; }
              .badge.danger { background: #4a1a1a; color: #f85149; border: 1px solid #f85149; }
              .container { max-width: 1200px; margin: 0 auto; padding: 40px; }
              .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; margin-bottom: 40px; }
              .card { background: #161b27; border: 1px solid #30363d; border-radius: 12px; padding: 24px; transition: border-color 0.2s; }
              .card:hover { border-color: #58a6ff; }
              .card-icon { font-size: 32px; margin-bottom: 12px; }
              .card-title { font-size: 16px; font-weight: 600; color: #e6edf3; margin-bottom: 8px; }
              .card-desc { font-size: 13px; color: #8b949e; line-height: 1.5; }
              .card-link { display: inline-block; margin-top: 16px; padding: 8px 16px; background: #1f6feb; color: white; border-radius: 6px; text-decoration: none; font-size: 13px; font-weight: 500; }
              .card-link:hover { background: #388bfd; }
              .status-row { display: flex; align-items: center; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid #21262d; }
              .status-row:last-child { border-bottom: none; }
              .section-title { font-size: 20px; font-weight: 600; color: #e6edf3; margin-bottom: 20px; padding-bottom: 12px; border-bottom: 1px solid #30363d; }
              .meta { display: flex; gap: 24px; margin-top: 16px; }
              .meta-item { font-size: 13px; color: #8b949e; }
              .meta-item span { color: #e6edf3; font-weight: 500; }
            </style>
          </head>
          <body>
            <div class="header">
              <h1>🔒 Timo Security Report
                <span class="badge warning">Review Required</span>
              </h1>
              <p>Comprehensive security scan — DevSecOps Pipeline</p>
              <div class="meta">
                <div class="meta-item">Generated: <span id="date"></span></div>
                <div class="meta-item">Commit: <span>${{ github.sha }}</span></div>
                <div class="meta-item">Branch: <span>${{ github.ref_name }}</span></div>
                <div class="meta-item">Triggered by: <span>${{ github.actor }}</span></div>
              </div>
            </div>

            <div class="container">
              <h2 class="section-title">📊 Scan Results</h2>

              <div class="grid">
                <div class="card">
                  <div class="card-icon">🐳</div>
                  <div class="card-title">Trivy — Container & Dependencies</div>
                  <div class="card-desc">Docker image vulnerability scan + filesystem dependencies CVE check for all projects</div>
                  <a class="card-link" href="trivy-security-reports/trivy-docker-report.html">View Docker Report →</a>
                  <br>
                  <a class="card-link" style="margin-top:8px; background:#1a4a2e;" href="trivy-security-reports/trivy-backend-fs-report.html">View Backend FS →</a>
                  <br>
                  <a class="card-link" style="margin-top:8px; background:#1a4a2e;" href="trivy-security-reports/trivy-frontend-fs-report.html">View Frontend FS →</a>
                </div>

                <div class="card">
                  <div class="card-icon">🛡️</div>
                  <div class="card-title">OWASP Dependency Check</div>
                  <div class="card-desc">Known CVE vulnerabilities in npm packages. Checks NVD database for all dependencies.</div>
                  <a class="card-link" href="owasp-dependency-check-reports/owasp-backend-report/dependency-check-report.html">View Backend Report →</a>
                  <br>
                  <a class="card-link" style="margin-top:8px; background:#1a4a2e;" href="owasp-dependency-check-reports/owasp-frontend-report/dependency-check-report.html">View Frontend Report →</a>
                </div>

                <div class="card">
                  <div class="card-icon">⚡</div>
                  <div class="card-title">OWASP ZAP — API Security</div>
                  <div class="card-desc">Dynamic security testing of live API. Tests for OWASP Top 10: SQL injection, XSS, CSRF, etc.</div>
                  <a class="card-link" href="owasp-zap-reports/zap-baseline-report.html">View ZAP Report →</a>
                </div>

                <div class="card">
                  <div class="card-icon">📊</div>
                  <div class="card-title">SonarQube — Code Quality</div>
                  <div class="card-desc">Static code analysis. Code smells, bugs, security hotspots, duplications, coverage.</div>
                  <a class="card-link" href="sonarqube-reports/sonar-backend-report.html">View Sonar Report →</a>
                </div>

                <div class="card">
                  <div class="card-icon">🔑</div>
                  <div class="card-title">Gitleaks — Secrets Scan</div>
                  <div class="card-desc">Scans entire git history for leaked API keys, passwords, tokens, private keys.</div>
                  <a class="card-link" href="gitleaks-secrets-report/gitleaks-report.html">View Secrets Report →</a>
                </div>
              </div>

              <h2 class="section-title">📋 Pipeline Status</h2>
              <div class="card">
                <div class="status-row">
                  <span>Trivy Scan</span>
                  <span class="badge ${{ needs.trivy-scan.result == 'success' && 'success' || 'warning' }}">${{ needs.trivy-scan.result }}</span>
                </div>
                <div class="status-row">
                  <span>OWASP Dependency Check</span>
                  <span class="badge ${{ needs.owasp-dependency-check.result == 'success' && 'success' || 'warning' }}">${{ needs.owasp-dependency-check.result }}</span>
                </div>
                <div class="status-row">
                  <span>OWASP ZAP</span>
                  <span class="badge ${{ needs.owasp-zap.result == 'success' && 'success' || 'warning' }}">${{ needs.owasp-zap.result }}</span>
                </div>
                <div class="status-row">
                  <span>SonarQube</span>
                  <span class="badge ${{ needs.sonarqube.result == 'success' && 'success' || 'warning' }}">${{ needs.sonarqube.result }}</span>
                </div>
                <div class="status-row">
                  <span>Gitleaks Secrets Scan</span>
                  <span class="badge ${{ needs.secrets-scan.result == 'success' && 'success' || 'warning' }}">${{ needs.secrets-scan.result }}</span>
                </div>
              </div>
            </div>
            <script>document.getElementById('date').textContent = new Date().toLocaleString();</script>
          </body>
          </html>
          EOF

      - name: Upload consolidated security report
        uses: actions/upload-artifact@v4
        with:
          name: 🔒-FULL-SECURITY-REPORT
          path: all-reports/
          retention-days: 30

      - name: Final Summary
        run: |
          echo "## 🔒 Security Pipeline Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Tool | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| 🐳 Trivy | ${{ needs.trivy-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🛡️ OWASP Dependency Check | ${{ needs.owasp-dependency-check.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| ⚡ OWASP ZAP | ${{ needs.owasp-zap.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 📊 SonarQube | ${{ needs.sonarqube.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🔑 Gitleaks | ${{ needs.secrets-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📥 **Download full report:** Actions → This run → Artifacts → 🔒-FULL-SECURITY-REPORT" >> $GITHUB_STEP_SUMMARY
