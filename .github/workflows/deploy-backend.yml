name: Deploy Backend

on:
  push:
    branches: [main]
    paths:
      - "cripto_exchange-main/**"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Zip and upload backend to S3
        run: |
          zip -r cripto.zip cripto_exchange-main/
          aws s3 cp cripto.zip s3://criptoex-releases-ba87ee85/cripto.zip

      - name: Deploy on EC2 via SSM
        run: |
          aws ssm send-command \
            --instance-ids i-04bf3814b1172c566 \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=["sudo bash /home/ubuntu/deploy-cripto.sh"]' \
            --region ap-south-1 \
            --output text
